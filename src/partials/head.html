<script>document.addEventListener('DOMContentLoaded',function(){
var SLIDES={"gif-agent-run": 10, "gif-agents": 5, "gif-chat-streaming": 8, "gif-code": 7, "gif-confirmation": 4, "gif-connectors": 6, "gif-cron": 5, "gif-dashboard": 12, "gif-memory": 3, "gif-orchestrator": 6, "gif-scheduler": 7, "gif-search": 9, "gif-session-data": 4, "gif-settings": 7, "gif-tool-loop": 7, "gif-vaults": 4, "master-demo": 13, "gif-pairing": 5};
var w=['/images/misc/wallpaper-1.jpg','/images/misc/wallpaper-2.jpg','/images/misc/wallpaper-3.jpg','/images/misc/wallpaper-4.jpg','/images/misc/wallpaper-5.jpg'];
document.querySelectorAll('[data-wallpaper]').forEach(function(i){i.src=w[Math.floor(Math.random()*w.length)]});
var pool=['hub-home','chat-structured','chat-agent-run','chat-confirmation','search-palette','agent-profile','orchestrator','settings-providers','settings-memory','settings-tools','settings-mcp','settings-agents','settings-webhooks','scheduler','pairing','dashboard','group-compose','broadcast-compose','session-data-panel','cron-detail','code'];
document.querySelectorAll('[data-ui-example]').forEach(function(d){
  var key=d.getAttribute('data-ui-src')||pool[Math.floor(Math.random()*pool.length)];
  var i=document.createElement('img');
  i.src='/images/screens/'+key+'.png';
  i.alt='Zod screenshot';
  i.className='ui-shot-static';
  i.loading='lazy';
  d.appendChild(i);
  var gif=d.getAttribute('data-ui-gif');
  var n=SLIDES[gif]||0;
  if(n>1){
    // a slideshow of full-size screenshots of the real app, playing while it is on screen
    var imgs=[],idx=0,timer=null;
    for(var k=1;k<=n;k++){
      var g=document.createElement('img');
      g.src='/images/slides/'+gif+'/'+('00'+k).slice(-3)+'.webp';
      g.alt='Zod in use';
      g.className='ui-shot-gif'+(k===1?' is-on':'');
      g.loading='lazy';
      d.appendChild(g);imgs.push(g);
    }
    var MS=3200,bar=document.createElement('span');bar.className='ui-progress';bar.innerHTML='<i></i>';bar.setAttribute('aria-hidden','true');d.appendChild(bar);d.style.setProperty('--ui-ms',MS+'ms');
    var restart=function(){var b=bar.firstChild;b.style.animation='none';void b.offsetWidth;b.style.animation=''};
    var show=function(j){imgs.forEach(function(m,q){m.classList.toggle('is-on',q===j)});restart()};
    var play=function(){if(timer)return;d.classList.add('is-anim');restart();timer=setInterval(function(){idx=(idx+1)%n;show(idx)},MS)};
    var stop=function(){clearInterval(timer);timer=null;bar.firstChild.style.animationPlayState='paused'};
    var go=function(){bar.firstChild.style.animationPlayState='';play()};
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){e.isIntersecting?go():stop()})},{threshold:0.35}).observe(d)}else{go()}
    d.addEventListener('mouseenter',stop);d.addEventListener('mouseleave',function(){if(d.classList.contains('is-anim'))go()});
  }
});
});</script>
