<header class="sticky top-0 z-50 w-full border-b border-theme-border-02 bg-theme-bg" x-data="{ mobileOpen: false }">
  <div class="flex h-12 w-full items-center px-6">
    <!-- Left: Logo + Nav -->
    <div class="flex items-center space-x-6 flex-1">
      <a href="/" aria-label="Zod Agent Home">
        <svg class="h-5 w-auto text-theme-text" viewBox="4.0365 3.7214 478 174.3693" aria-hidden="true">
          <!-- @import "./logo.html" -->
        </svg>
      </a>
      <nav class="hidden lg:flex items-center space-x-1">
        <a href="/resources/docs" class="nav-link relative px-3 py-2 text-sm font-medium transition-colors rounded-sm text-theme-text-sec hover:text-theme-text" data-page="docs">Docs</a>
        <a href="/resources/docs/api" class="nav-link relative px-3 py-2 text-sm font-medium transition-colors rounded-sm text-theme-text-sec hover:text-theme-text" data-page="api">Providers</a>
        <a href="/resources/docs/tools" class="nav-link relative px-3 py-2 text-sm font-medium transition-colors rounded-sm text-theme-text-sec hover:text-theme-text" data-page="tools">Tools</a>
        <a href="/resources/docs/orchestrator" class="nav-link relative px-3 py-2 text-sm font-medium transition-colors rounded-sm text-theme-text-sec hover:text-theme-text" data-page="orchestrator">Orchestrator</a>
        <a href="/resources/docs/scheduler" class="nav-link relative px-3 py-2 text-sm font-medium transition-colors rounded-sm text-theme-text-sec hover:text-theme-text" data-page="scheduler">Scheduler</a>
      </nav>
    </div>
    <!-- Right: Actions -->
    <div class="flex items-center space-x-2 flex-1 justify-end">
      <div class="hidden sm:flex items-center gap-2">
        <a href="/product/pricing" class="inline-flex items-center justify-center rounded-full px-3 py-1.5 text-sm font-normal cursor-pointer bg-theme-bg text-theme-text border border-theme-border-02 hover:bg-theme-card-hex transition-colors">Pricing</a>
        <a href="/resources/download" class="inline-flex items-center justify-center rounded-full px-3 py-1.5 text-sm font-normal cursor-pointer bg-theme-button-bg text-theme-button-text border border-theme-button-bg hover:bg-theme-button-hover-bg transition-colors">Get the app</a>
      </div>
      <button class="inline-flex items-center justify-center rounded-md hover:bg-theme-card-hex size-7 cursor-pointer lg:hidden" type="button" aria-label="Menu" @click="mobileOpen = !mobileOpen">
        <i data-lucide="menu" class="h-5 w-5 text-theme-text" aria-hidden="true" x-show="!mobileOpen"></i>
        <i data-lucide="x" class="h-5 w-5 text-theme-text" aria-hidden="true" x-show="mobileOpen" x-cloak></i>
      </button>
    </div>
  </div>
  <!-- Mobile drawer -->
  <div x-show="mobileOpen" x-cloak x-collapse class="lg:hidden border-t border-theme-border-02 bg-theme-card-hex">
    <nav class="flex flex-col px-4 py-3 space-y-1">
      <a href="/resources/docs" class="px-3 py-2 text-sm font-medium rounded-sm text-theme-text-sec hover:text-theme-text hover:bg-theme-bg/80 transition-colors">Docs</a>
      <a href="/resources/docs/api" class="px-3 py-2 text-sm font-medium rounded-sm text-theme-text-sec hover:text-theme-text hover:bg-theme-bg/80 transition-colors">Providers</a>
      <a href="/resources/docs/tools" class="px-3 py-2 text-sm font-medium rounded-sm text-theme-text-sec hover:text-theme-text hover:bg-theme-bg/80 transition-colors">Tools</a>
      <a href="/resources/docs/orchestrator" class="px-3 py-2 text-sm font-medium rounded-sm text-theme-text-sec hover:text-theme-text hover:bg-theme-bg/80 transition-colors">Orchestrator</a>
      <a href="/resources/docs/scheduler" class="px-3 py-2 text-sm font-medium rounded-sm text-theme-text-sec hover:text-theme-text hover:bg-theme-bg/80 transition-colors">Scheduler</a>
      <a href="/resources/download" class="px-3 py-2 text-sm font-medium rounded-sm text-theme-text-sec hover:text-theme-text hover:bg-theme-bg/80 transition-colors">Get the app</a>
    </nav>
  </div>
  <script>document.querySelectorAll('.nav-link').forEach(function(l){var h=l.getAttribute('href').replace(/\/$/,'');var p=window.location.pathname.replace(/\/$/,'');if(h===p){l.classList.add('text-theme-text');var d=document.createElement('div');d.className='absolute -bottom-[6px] left-0 right-0 h-0.5 bg-theme-text';l.appendChild(d)}})</script>
</header>
